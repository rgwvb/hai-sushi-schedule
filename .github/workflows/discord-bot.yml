name: Discord bot tests
on:
  push:
    branches: [main]
    paths: ['discord-bot/**', '.github/workflows/discord-bot.yml']
  pull_request:
    paths: ['discord-bot/**', '.github/workflows/discord-bot.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: discord-bot
      - run: npm test
        working-directory: discord-bot
