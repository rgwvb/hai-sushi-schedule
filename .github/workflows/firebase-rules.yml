name: Firebase save security rules
on:
  push:
    branches: [main]
    paths: ['firestore.rules', 'firebase.json', 'scripts/firestore_rules_test.mjs', '.github/workflows/firebase-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-save firebase @firebase/rules-unit-testing
      - run: npx -y firebase-tools@latest emulators:exec --only firestore --project demo-police-career 'node scripts/firestore_rules_test.mjs'
