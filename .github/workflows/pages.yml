name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Core interaction smoke test
        shell: bash
        run: |
          npm install --no-save jsdom@26
          node scripts/smoke_test.mjs
      - name: Build nationwide police directory
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4
          timeout 45s python scripts/build_police_directory.py || echo "Police directory refresh failed/timed out; deploying checked-in fallback."
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
